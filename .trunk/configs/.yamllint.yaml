rules:
  quoted-strings:
    required: only-when-needed
    extra-allowed: ["{|}"]
  key-duplicates: {}
  octal-values:
    forbid-implicit-octal: true
  indentation:
    size: 2
    style: tab
    indent-sequences: true
    check-multi-line-strings: false
  hyphens:
    max-spaces-after: 1
  line-length:
    max: 120
  trailing-whitespace:
    allow-at-eol: true
    allow-at-eof: true
