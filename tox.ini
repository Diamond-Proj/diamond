[tox]
requires = tox>=4
env_list = py311,lint,type
no_package = true

[testenv]
allowlist_externals =
    uv
    pytest
deps =
    .[dev]
setenv =
    SQLALCHEMY_DATABASE_URI = sqlite:///:memory:
    FLASK_ENV = testing
commands = pytest {posargs}
install_command = uv pip install {opts} {packages}
list_dependencies_command = uv pip list
package = wheel

[testenv:lint]
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:format]
deps = ruff
commands = ruff format .

[testenv:type]
deps = mypy
commands = mypy app --ignore-missing-imports
