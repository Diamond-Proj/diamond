[tox]
requires = tox>=4
env_list = py311,lint,type
no_package = true

[testenv]
allowlist_externals = uv
deps =
    pytest
    pytest-cov
commands = pytest {posargs}
install_command = uv pip install {opts} {packages}
list_dependencies_command = uv pip list

[testenv:lint]
deps = ruff
commands = ruff check .

[testenv:format]
deps = ruff
commands = ruff format .

[testenv:type]
deps = mypy
commands = mypy app --ignore-missing-imports
