# Manually tear down a branch's dev deployment. Thin wrapper around
# scripts/dev-down.sh -- destroys that branch's ECS services/ALB and drops
# its database, freeing the slug for the next person.
name: Teardown dev branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to tear down (defaults to the branch this workflow is run from)'
        required: false
        default: ''

concurrency:
  group: deploy-dev-branch-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Tear down branch
        run: ./terraform/scripts/dev-down.sh "${{ inputs.branch || github.ref_name }}"
